<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>b watch · Сопри го времето</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black:   #1A1A18;
    --dark:    #2A2825;
    --mid:     #888882;
    --light:   #CCCCC6;
    --border:  rgba(26,26,24,0.12);
    --bg:      #F8F7F4;
    --white:   #FFFFFF;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--black);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    cursor: none;
  }

  .layout {
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 3vh 4vw;
  }

  /* HEADER */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 2vh;
    border-bottom: 0.5px solid var(--border);
  }

  .logo-svg { height: clamp(36px, 5vh, 56px); width: auto; }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .june-badge {
    font-size: clamp(9px, 0.9vw, 12px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--mid);
    font-weight: 300;
  }
  .target-toggle { display: flex; gap: 8px; }
  .t-btn {
    font-family: 'DM Mono', monospace;
    font-size: clamp(10px, 1vw, 13px);
    padding: 5px 16px;
    border-radius: 100px;
    border: 0.5px solid var(--light);
    background: transparent;
    color: var(--mid);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .t-btn.active {
    border-color: var(--black);
    color: var(--black);
    background: var(--black);
    color: var(--bg);
  }

  /* CENTER */
  .center {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4vh;
  }

  .tagline {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(15px, 1.8vw, 22px);
    color: var(--mid);
    letter-spacing: 0.5px;
    text-align: center;
    font-style: italic;
  }

  .timer {
    font-family: 'DM Mono', monospace;
    font-size: clamp(68px, 13vw, 170px);
    font-weight: 300;
    letter-spacing: 6px;
    color: var(--black);
    line-height: 1;
    transition: color 0.2s, opacity 0.2s;
  }
  .timer.running { color: var(--dark); opacity: 0.75; }
  .timer.win { color: var(--black); opacity: 1; animation: stamp 0.3s ease; }
  .timer.close { color: var(--dark); opacity: 0.9; }
  .timer.miss { color: var(--mid); }

  @keyframes stamp {
    0% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .target-label {
    font-size: clamp(11px, 1vw, 13px);
    color: var(--light);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
  }
  .target-label span {
    font-family: 'DM Mono', monospace;
    color: var(--mid);
  }

  /* BUTTON */
  .btn-area { display: flex; flex-direction: column; align-items: center; gap: 2.5vh; }

  .big-btn {
    width: clamp(110px, 14vw, 180px);
    height: clamp(110px, 14vw, 180px);
    border-radius: 50%;
    border: 0.5px solid var(--black);
    background: transparent;
    color: var(--black);
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(12px, 1.3vw, 16px);
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    outline: none;
    position: relative;
  }
  .big-btn::after {
    content: '';
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 0.5px solid rgba(26,26,24,0.12);
    transition: inset 0.2s;
  }
  .big-btn:hover { background: var(--black); color: var(--bg); }
  .big-btn:hover::after { inset: -18px; }
  .big-btn:active { transform: scale(0.96); }
  .big-btn.running {
    background: var(--black);
    color: var(--bg);
    animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* RESULT */
  .result-wrap {
    min-height: 52px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    opacity: 0; transform: translateY(6px);
    transition: all 0.3s ease;
  }
  .result-wrap.show { opacity: 1; transform: translateY(0); }
  .result-prize {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(15px, 2.2vw, 28px);
    color: var(--black);
    text-align: center;
  }
  .result-prize.dim { color: var(--mid); }
  .result-diff {
    font-family: 'DM Mono', monospace;
    font-size: clamp(11px, 1vw, 14px);
    color: var(--light);
    letter-spacing: 2px;
  }

  /* FOOTER */
  .footer {
    padding-top: 2vh;
    border-top: 0.5px solid var(--border);
    display: flex; justify-content: center;
    gap: clamp(20px, 4vw, 60px);
    align-items: center; flex-wrap: wrap;
  }
  .prize-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .prize-range {
    font-family: 'DM Mono', monospace;
    font-size: clamp(10px, 0.9vw, 12px);
    color: var(--light);
    letter-spacing: 1px;
  }
  .prize-value {
    font-size: clamp(11px, 1vw, 13px);
    font-weight: 500;
    color: var(--black);
    letter-spacing: 0.5px;
  }
  .prize-value.dim { color: var(--mid); }
  .vdiv { width: 0.5px; height: 30px; background: var(--border); }

  .cursor {
    position: fixed; pointer-events: none; z-index: 9999;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--black);
    transform: translate(-50%, -50%);
  }
</style>
</head>

<script>
  let target = 10000, startTime = null, raf = null, running = false;

  document.addEventListener('mousemove', e => {
    const c = document.getElementById('cursor');
    c.style.left = e.clientX + 'px';
    c.style.top = e.clientY + 'px';
  });

  function setTarget(sec) {
    if (running) return;
    target = sec * 1000;
    document.getElementById('t10').classList.toggle('active', sec === 10);
    document.getElementById('t7').classList.toggle('active', sec === 7);
    document.getElementById('targetShow').textContent = String(sec).padStart(2,'0') + ':00:00';
    reset();
  }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    const cs = Math.floor((ms % 1000) / 10);
    const m = Math.floor(ms % 10);
    return String(s).padStart(2,'0') + ':' + String(cs).padStart(2,'0') + ':' + m;
  }

  function tick() {
    const el = Date.now() - startTime;
    document.getElementById('display').textContent = fmt(el);
    if (el < 60000) raf = requestAnimationFrame(tick);
    else stopTimer(el);
  }

  function handleBtn() {
    if (!running) {
      startTime = Date.now(); running = true;
      const btn = document.getElementById('mainBtn');
      btn.textContent = 'СТОПИРАЈ'; btn.classList.add('running');
      document.getElementById('display').className = 'timer running';
      document.getElementById('resultWrap').classList.remove('show');
      raf = requestAnimationFrame(tick);
    } else {
      const el = Date.now() - startTime;
      cancelAnimationFrame(raf);
      stopTimer(el);
    }
  }

  function stopTimer(elapsed) {
    running = false;
    const btn = document.getElementById('mainBtn');
    btn.textContent = 'ПРОБАЈ ПАК'; btn.classList.remove('running');
    document.getElementById('display').textContent = fmt(elapsed);

    const diff = elapsed - target;
    const abs = Math.abs(diff);
    const sign = diff > 0 ? '+' : '';

    const prize = document.getElementById('prizeText');
    const diffEl = document.getElementById('diffText');
    const timer = document.getElementById('display');
    const wrap = document.getElementById('resultWrap');

    diffEl.textContent = sign + diff + ' ms';

    if (abs === 0) {
      timer.className = 'timer win'; prize.className = 'result-prize';
      prize.textContent = 'Главна награда — совршено!';
    } else if (abs <= 50) {
      timer.className = 'timer win'; prize.className = 'result-prize';
      prize.textContent = '20% попуст';
    } else if (abs <= 200) {
      timer.className = 'timer close'; prize.className = 'result-prize';
      prize.textContent = '10% попуст';
    } else if (abs <= 500) {
      timer.className = 'timer miss'; prize.className = 'result-prize dim';
      prize.textContent = 'Бесплатно чистење на часовник';
    } else {
      timer.className = 'timer miss'; prize.className = 'result-prize dim';
      prize.textContent = 'Нема награда — пробај пак!';
    }
    wrap.classList.add('show');
  }

  function reset() {
    document.getElementById('display').className = 'timer';
    document.getElementById('display').textContent = '00:00:00';
    document.getElementById('resultWrap').classList.remove('show');
    document.getElementById('mainBtn').textContent = 'СТАРТ';
    document.getElementById('mainBtn').classList.remove('running');
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); handleBtn(); }
  });
</script>
</body>
</html>
